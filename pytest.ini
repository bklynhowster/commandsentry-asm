[pytest]
# Collection scope. Without this pytest walks .venv (thousands of vendored
# tests) and any scratch dir.
norecursedirs = .venv .git __pycache__ node_modules web work artifacts

# ─── Why python_functions is narrowed to test_* ──────────────────────
# pytest's DEFAULT is "test*" — no underscore required. run_heavy.py has a
# PRODUCTION function named `testssl_is_degraded` (it wraps testssl.sh), and
# test_run_heavy.py imports it. pytest then collected that production function
# as a test case, tried to call it, and errored looking for a fixture named
# `rc` — one ERROR on every run, caused entirely by a naming coincidence.
#
# Requiring the underscore fixes it without renaming a production function to
# satisfy a test runner. Every real test in both repos already uses `test_`.
python_functions = test_*
python_files = test_*.py
python_classes = Test*

# Show the slowest 10 — the naabu/reconfirm phases make real socket calls if
# a stub is missed, and that shows up here as a multi-second test.
addopts = -q --durations=10
