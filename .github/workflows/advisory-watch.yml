name: Advisory watch

# KB 12 job 3d (2026-10-21). Once a day, before the 12:00 UTC digest: match new
# advisories (NVD critical in the last 30 days, CISA known-exploited in the
# last 90) against the products the scans have already seen on our hosts, and
# write one finding per (asset, product). Version not shown -> "confirm it's
# patched" (MODERATE; HIGH when on CISA's exploited list).
#
# Talks only to NVD, CISA and the database — never to a scanned host (D-056).
# It reads the tech lists the scans already banked; it scans nothing.
#
# D-077 step 2 (2026-11-12): for a sign-in a deep scan named with a version (the
# `signin_door` artifact), it also reads two more PUBLIC sources, still never a
# scanned host: the maker's release list on GitHub (api.github.com) and the open
# advisory database (api.osv.dev), then NVD once per flaw. GITHUB_TOKEN below is
# this workflow's own short-lived token: it only lifts GitHub's shared-address
# rate limit for that public read, is sent to api.github.com alone and is never
# printed. A run with many flaws to read takes longer, hence 30 minutes.
#
# Needs the enum value from migration 20261021a. A public source being down is a
# WARNING: that product changes nothing this run and the next run tries again.

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read everything, write nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: advisory-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'psycopg[binary]==3.3.4'

      - name: Match new advisories to our hosts
        env:
          SUPABASE_DSN: ${{ secrets.SUPABASE_DSN }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/scanner/advisory_watch.py
