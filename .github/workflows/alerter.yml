name: Daily posture digest

# Runs once a day at 12:00 UTC = 07:00 ET (08:00 ET during EDT).
# Adjust the cron line if you want a different time. Cron uses UTC.
#
# Also runnable manually from the Actions tab via workflow_dispatch.
# dry_run=true is safe; it skips email + DB writes.
#
# Email transport: SendGrid (D-031, 2026-05-28 cutover). The legacy
# RESEND_API_KEY env var is still passed through for a transition
# period so the alerter's `SENDGRID_API_KEY or RESEND_API_KEY` fallback
# in run_alerter.py keeps working if SENDGRID_API_KEY isn't set.

#
# KB 12 job 3l slice 2 (2026-10-22) — THE MONDAY WEEKLY rides in this same job, so
# its identity is the daily's (one block of variables; the 318 pins cover both).
# Howie, 14:59: "the weekly should definitely be Monday. If it's not Monday, it's
# Friday, and frankly, on Friday, nobody pays attention." Its cron fires five
# minutes after the daily's, so Monday brings the daily list and then the week.
#
# AND A TEST SEND (Howie, 16:54: "generate a daily and a weekly to send to me and
# the other recipients"): run by hand with preview=true. It sends the last 24
# hours (or, with kind=weekly, the last seven days) right away and WRITES NOTHING,
# so the next scheduled digest covers exactly what it would have. preview_to may
# narrow the recipients to some of ALERTER_TO; run_alerter.py refuses any address
# that is not already on it.

on:
  schedule:
    - cron: "0 12 * * *"     # the daily list
    - cron: "5 12 * * 1"     # the Monday weekly
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render but don't send / write"
        required: false
        default: "false"
      kind:
        description: "daily or weekly"
        required: false
        default: "daily"
      preview:
        description: "Test send: send now, record nothing (true/false)"
        required: false
        default: "false"
      preview_to:
        description: "Test send only: some of ALERTER_TO, comma-separated (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

# KB 12 job 3s (2026-10-23) — Monday order. The scheduled daily (12:00) and weekly (12:05)
# share group `alerter`, so the daily finishes and records what it told before the weekly
# reads the record. A test send (preview=true) has its own group, so it can never take the
# one pending slot of a scheduled run. Nothing is ever cancelled. The group is
# "alerter-test-send-false" for the schedule and any real run, "alerter-test-send-true" for a
# test send (written without `|| 'literal'`, which the 318 identity guard reserves).
concurrency:
  group: alerter-test-send-${{ github.event.inputs.preview == 'true' }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 316: PyYAML — the block-page library (312) reads artifact_signatures.yaml.
          # Its absence crashed the 2026-10-14 digest on the first measured block.
          pip install 'psycopg[binary]==3.3.4' 'pyyaml>=6,<7'

      - name: Run alerter
        env:
          SUPABASE_DSN:        ${{ secrets.SUPABASE_DSN }}
          # D-031 (2026-05-28): primary SendGrid API key, with the legacy
          # Resend key kept as fallback during the transition. The Python
          # script prefers SENDGRID_API_KEY when set.
          SENDGRID_API_KEY:    ${{ secrets.SENDGRID_API_KEY }}
          RESEND_API_KEY:      ${{ secrets.RESEND_API_KEY }}
          # Mail transport (4.7 M1). Command: sendgrid. Prodex: smtp/iCloud.
          MAIL_PROVIDER:       ${{ vars.MAIL_PROVIDER }}
          SMTP_HOST:           ${{ vars.SMTP_HOST }}
          SMTP_PORT:           ${{ vars.SMTP_PORT }}
          SMTP_USER:           ${{ vars.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          INSTANCE_NAME:       ${{ github.event.repository.name }}
          # Which digest, and whether it is a test send. Read as variables, never
          # pasted into the script: a typed input cannot become a shell command.
          EVENT_NAME:          ${{ github.event_name }}
          EVENT_SCHEDULE:      ${{ github.event.schedule }}
          IN_DRY_RUN:          ${{ github.event.inputs.dry_run }}
          IN_KIND:             ${{ github.event.inputs.kind }}
          IN_PREVIEW:          ${{ github.event.inputs.preview }}
          ALERTER_PREVIEW_TO:  ${{ github.event.inputs.preview_to }}
          #
          # ⚠️ THE `||` FALLBACKS BELOW ARE COMMAND-ONLY AND MUST NOT BE COPIED
          # TO ANOTHER INSTANCE. run_alerter.py deliberately has NO defaults for
          # these (4.7 M5) precisely so an unset var can't silently send as the
          # wrong tenant — but a workflow-level `||` default re-introduces
          # exactly that hazard. It is safe HERE only because these literals ARE
          # Command's own identity. If this file is ever mirrored to Prodex,
          # DELETE the `|| '...'` halves and set repo variables instead.
          ALERTER_FROM:        ${{ vars.ALERTER_FROM       || 'CommandSentry@commandcompanies.com' }}
          ALERTER_FROM_NAME:   ${{ vars.ALERTER_FROM_NAME  || 'COMMANDsentry' }}
          ALERTER_TO:          ${{ vars.ALERTER_TO         || 'hschneider@commandcompanies.com,howiehow@mac.com' }}
          # KB 12 job 3l (Howie, 2026-10-26): every scheduled digest goes to this one address
          # first; the rest of ALERTER_TO gets it only after he presses Send in that email
          # (approval.py; digest-send.yml sends it). Repo variable only, NO fallback: unset =
          # the digest sends nothing.
          ALERTER_APPROVER: ${{ vars.ALERTER_APPROVER }}
          ALERTER_DASHBOARD_URL: ${{ vars.ALERTER_DASHBOARD_URL || 'https://supabase.com/dashboard/project/hdygktppfvuspnumpfuq' }}
          # Note 307 — links in the email go to the portal, not the raw database.
          ALERTER_PORTAL_URL:    ${{ vars.ALERTER_PORTAL_URL    || 'https://commandsentry-portal.netlify.app' }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "5 12 * * 1" ]; then args+=(--weekly); fi
          else
            if [ "$IN_KIND" = "weekly" ]; then args+=(--weekly); fi
            if [ "$IN_PREVIEW" = "true" ]; then args+=(--preview); fi
            if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          fi
          echo "run_alerter.py ${args[*]}"
          python scripts/alerter/run_alerter.py "${args[@]}"
