name: Device-class classify

# One-click device-class classifier runner (4.7 D2/D3/D4 + E1-E6).
#   dry-run:  writes device_class_dryrun audit rows ONLY — the soak instrument.
#             Changes nothing about assets or scanning.
#   write:    ALSO stamps assets.device_class + confidence + evidence + vendor_product.
#
# ⚠ "classify-only, no routing change" (D4 Phase A) is true of the RUNNER, not of the
# system: scripts/asm/cloud_ip_check.py reads assets.device_class to pick the port
# scope (cloud_endpoint/cdn/waf -> curated ports; origin_host -> full sweep; unknown ->
# the local CIDR table, else full sweep). A stamp that moves an asset between those
# buckets changes its next scan. The runner records that per row as
# device_class_dryrun.would_reroute; the audit trail is the place to look.
#
# Ungated on purpose (unlike Migrate): no DDL, reversible metadata. Uses THIS
# instance's SUPABASE_DSN (same secret as Migrate); the workflow in each repo hits
# its own DB.

on:
  # 4.7 (Obsidian 154, 2026-07-22): scheduled every 6h, offset per instance so the two
  # DBs do not contend (154-Q2): Command @:15, Prodex @:45.
  #
  # WRITE MODE ON THE SCHEDULE since 2026-10-13 (Obsidian 309; the soak 154 opened on
  # 07-22 ran 11 weeks in dry-run: the proposals were identical on every pass from
  # 09-18/09-22 on, the known-good FortiWeb hosts kept their class, and the single-
  # signal "suspected" hosts were reviewed one by one — 154-Q1's exit bar). A schedule
  # trigger sends no `mode` input; the gate below treats "no input" as write. A manual
  # dispatch still DEFAULTS to dry-run (a human click should not write by accident)
  # and writes only when mode=write is chosen.
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = audit rows only (soak) | write = also stamp device_class (classify-only)'
        type: choice
        options: [dry-run, write]
        default: dry-run
      soak_generation:
        description: 'Soak generation — bump after a soak-clock reset (4.7 E3)'
        type: string
        default: '1'

concurrency:
  group: device-class-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet 'psycopg[binary]' pyyaml
      - name: Run device-class classifier
        env:
          SUPABASE_DSN: ${{ secrets.SUPABASE_DSN }}
          # Inputs reach the shell as ENV, never interpolated into the script body.
          # MODE: 'write' on the schedule (no input), the chosen value on a dispatch.
          MODE: ${{ github.event.inputs.mode || 'write' }}
          SOAK_GENERATION: ${{ github.event.inputs.soak_generation || '1' }}
        run: |
          ARGS="--soak-generation $SOAK_GENERATION"
          case "$MODE" in
            write)   ARGS="$ARGS --write" ;;
            dry-run) ;;
            *) echo "::error::unknown mode '$MODE' (want write or dry-run)"; exit 1 ;;
          esac
          echo "::notice::device_class_runner.py $ARGS  (event: ${{ github.event_name }})"
          python scripts/db/device_class_runner.py $ARGS
