name: VPN egress reachability test

# ─────────────────────────────────────────────────────────────────────────────
# A TEST, NOT A SCAN. Rewritten 2026-10-29 (push-372) for job 3u, "a second
# opinion before down".
#
# WHY: test.commandcommcentral.com went silent to Sentry on Oct 27, both to
# GitHub's address and to the scanner's one usual Mullvad exit. On Oct 29
# Howie reached ports 80, 443 and 8080 from a VPN address, and nothing from
# his home address. Howie, 2026-10-29 09:28: "there are many Mullvad VPN IP
# addresses. I want you to create a script that uses, say, eight of them and
# attempts to connect to the box, and we see what happens." The answer says
# whether other Mullvad exits can tell "it blocks us" apart from "it's down".
#
# WHAT IT DOES:
#   0. Waits while a Command scan holds the VPN (read only), so the test
#      does not start a tunnel beside a scan's.
#   1. GitHub's own address first, as a control. No tunnel.
#   2. N Mullvad exits picked at random, a different city each where the pool
#      allows. For each: bring the tunnel up, prove the exit address changed,
#      try a plain TCP connect to each port (connect, then close; nothing is
#      sent), tear the tunnel down. An exit we cannot prove is NOT tested.
#   3. One table in the run's summary.
#
# HOWIE'S RULES IT KEEPS:
#   * Extra VPN exits are used only to find out whether a port is open.
#     Nothing is scanned through them: no requests, no logins, no payloads.
#   * It never runs by itself. The Run button only (workflow_dispatch).
#   * Public Actions logs: no addresses printed, not the box's and not the
#     exits'. Each is masked the moment it is known. Routes are named by
#     Mullvad server name and city.
#   * The target is a fixed list, not free text: Command's own hosts only.
#
# It never uses the scanner's usual exit (the first config alphabetically).
# The old version tried five city names (us-nyc, ...) that no longer exist;
# the pool has been per-server configs (us-nyc-wg-001, ...) since 2026-06.
#
# 2026-11-02 (push-391, job 4m): ftp.unimacgraphics.com added. Since about
# Oct 24 every deep scan of Command's hosts on 208.199.0.x gets no answer
# through the scanner's usual exit (Mullvad Chicago), while a light scan from
# GitHub's own address gets in, and Howie's Mac gets in through ExpressVPN
# from Chicago, New York and Los Angeles. Howie, 14:20: "We need to determine
# if Mullvad is no longer a viable option, in which case we need to switch to
# a different VPN type provider." Ports are per target: the ftp host is tried
# on 22 and 443 (the two it answered on without the VPN), the box on 80, 443
# and 8080 as before.
#
# 2026-11-07 (push-420): "both-networks". Since Nov 2 (job 4n) every Command
# deep scan goes out through Mullvad us-chi-wg-304 instead of us-chi-wg-201.
# Through 304, Unimac's 208.199.0.x hosts answer the deep scan; Command's own
# network (Command Comm Central and SCI Image) answered 1 of 12 deep scans and
# commandmi.com 0 of 4, while the same sites answer straight from GitHub.
# Howie, 13:43: "Absolutely." (to finding which exits reach both networks).
# both-networks tries a fixed list of hosts from each network from every
# route: GitHub's own address, the two exits the deep scans have used
# (us-chi-wg-304, then us-chi-wg-201), then N others at random. Each host
# keeps its own ports; hosts are tried side by side. A host that does not
# resolve is reported and not tried. The one-host targets work as before.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'The host to try (Command-owned only), or both-networks (a fixed list of Command, SCI Image, Unimac and commandmi.com hosts)'
        required: true
        default: 'test.commandcommcentral.com'
        type: choice
        options:
          - test.commandcommcentral.com
          - ftp.unimacgraphics.com
          - both-networks
      exits:
        description: 'How many Mullvad exits to try (1 to 12)'
        required: true
        default: '8'
        type: string

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  reach-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/bklynhowster/commandsentry-scanner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --cap-add=NET_ADMIN
        --device=/dev/net/tun
    env:
      # Per target. The box: the three ports Howie found open from a VPN
      # address on 2026-10-29. The ftp host: 22 and 443, the two that answered
      # the 2026-11-02 light scan from GitHub's own address. both-networks
      # sets each host's own ports in the test step and ignores this.
      PORTS: ${{ inputs.target == 'ftp.unimacgraphics.com' && '22,443' || '80,443,8080' }}
      TARGET: ${{ inputs.target }}
      EXITS: ${{ inputs.exits }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the inputs and the baked-in tools
        run: |
          set -uo pipefail
          if ! [[ "$EXITS" =~ ^[1-9][0-9]?$ ]] || (( EXITS > 12 )); then
            echo "::error::exits must be a whole number from 1 to 12 (got '$EXITS')"; exit 1
          fi
          for t in wireguard-go wg gh curl python3 psql sudo; do
            command -v "$t" >/dev/null 2>&1 \
              || { echo "::error::missing baked tool: $t"; exit 1; }
          done
          echo "✓ inputs and tools OK — target $TARGET, $EXITS exit(s)"

      # Read only. Command's scan pool is one tunnel (VPN_SLOTS_N=1). Wait for
      # it to be free so this test does not start a tunnel beside a scan's. Same
      # stale rule as vpn_slot.py: a slot older than 40 minutes, or held by a
      # finished scan, counts as free. Errors are reported without the
      # database's own text, which can carry its address.
      - name: Wait while a Command scan holds the VPN
        env:
          SUPABASE_DSN: ${{ secrets.SUPABASE_DSN }}
        run: |
          set -uo pipefail
          SQL="select count(*) from public.vpn_slots s
                where s.scan_run_id is not null
                  and s.claimed_at > now() - interval '40 minutes'
                  and not exists (select 1 from public.scan_run r
                                   where r.scan_run_id = s.scan_run_id
                                     and r.status in ('complete','failed','degraded'));"
          for i in $(seq 1 40); do
            held=$(psql "$SUPABASE_DSN" -tA -c "$SQL" 2>/dev/null) \
              || { echo "::error::could not read the VPN slots (database error, text withheld) — stopping, nothing tested"; exit 1; }
            held=$(printf '%s' "$held" | tr -d '[:space:]')
            if [[ "$held" == "0" ]]; then
              echo "no Command scan is on the VPN — going ahead"
              exit 0
            fi
            echo "a Command scan is on the VPN — waiting 30s ($i/40)"
            sleep 30
          done
          echo "::error::a Command scan held the VPN for 20 minutes — stopping, nothing tested. Run it again later."
          exit 1

      - name: Fetch + patch the WireGuard configs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/wg-download
          gh release download vpn-tools \
            --repo bklynhowster/commandsentry-asm \
            --pattern 'mullvad-wg-configs.tar.gz' \
            --dir /tmp/wg-download \
            || { echo "::error::could not download the WireGuard configs"; exit 1; }
          sudo mkdir -p /etc/wireguard
          sudo tar xzf /tmp/wg-download/mullvad-wg-configs.tar.gz -C /tmp/wg-download
          sudo cp /tmp/wg-download/wg-configs/*.conf /etc/wireguard/
          sudo chmod 600 /etc/wireguard/*.conf
          # shellcheck disable=SC2024  # the log is ours, in /tmp; only the patch needs root
          sudo python3 scripts/scanner/patch_wg_configs.py > /tmp/patch.log 2>&1 \
            || { echo "::error::patch_wg_configs.py failed"; exit 1; }
          tail -1 /tmp/patch.log
          chmod +x scripts/scanner/*.sh
          echo "configs available: $(sudo ls /etc/wireguard/ | grep -c '\.conf$')"

      - name: Try the hosts from GitHub's address, then from each Mullvad exit
        run: |
          set -uo pipefail
          RESULTS=/tmp/reach.jsonl
          : > "$RESULTS"

          # The hosts to try, one per line: <name> <ports> <network>. One host,
          # unless the target is both-networks: a fixed list, Command-owned only.
          # Ports per host: the ones discovery saw answer from GitHub's own
          # address (the ftp hosts: 22 and 443, as push-391 set for the first).
          if [[ "$TARGET" == "both-networks" ]]; then
            cat > /tmp/targets.txt <<'EOF'
          www.commandcommcentral.com 80,443 Command
          api.commandcommcentral.com 80,443 Command
          testapi.commandcommcentral.com 80,443 Command
          edelivery.commandcommcentral.com 80,443 Command
          ftp.sciimage.com 80,443 Command
          insite.sciimage.com 80,443 Command
          vpn2.sciimage.com 443 Command
          ftp.unimacgraphics.com 22,443 Unimac
          ftp.commandmi.com 22,443 Unimac
          commandmi.com 80,443 GoDaddy
          EOF
            # The two exits the deep scans have used, tried first, every run.
            CONTROLS="us-chi-wg-304,us-chi-wg-201"
          else
            echo "$TARGET $PORTS -" > /tmp/targets.txt
            CONTROLS=""
          fi

          # Every address resolved once, before any tunnel, into a file (never
          # the log), then masked. A name that doesn't resolve is reported and
          # not tried.
          python3 - /tmp/targets.txt > /tmp/targets.resolved <<'PY'
          import socket, sys
          for line in open(sys.argv[1]):
              parts = line.split()
              if len(parts) != 3:
                  continue
              name, ports, net = parts
              try:
                  ip = socket.gethostbyname(name)
              except OSError:
                  ip = "-"
              print(name, ip, ports, net)
          PY
          resolved=0
          while read -r name ip _ _; do
            if [[ "$ip" == "-" ]]; then
              echo "could not resolve $name — not tried"
            else
              echo "::add-mask::$ip"
              resolved=$((resolved + 1))
            fi
          done < /tmp/targets.resolved
          (( resolved > 0 )) || { echo "::error::could not resolve the target — nothing tested"; exit 1; }

          # knock.py <resolved-file> — for each host, a plain TCP connect to
          # each of its ports, then close. Two tries per port, 5 s each. Sends
          # nothing. Hosts are tried side by side, each host's ports one after
          # another. Prints only names and port states, never an address.
          cat > /tmp/knock.py <<'PY'
          import json, socket, sys
          from concurrent.futures import ThreadPoolExecutor
          def knock(ip, ports):
              out = {}
              for port in ports:
                  state = "silent"
                  for _ in (1, 2):
                      s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                      s.settimeout(5)
                      try:
                          s.connect((ip, port))
                          state = "open"
                      except socket.timeout:
                          state = "silent"
                      except ConnectionRefusedError:
                          state = "refused"
                      except OSError:
                          state = "unreachable"
                      finally:
                          s.close()
                      if state in ("open", "refused"):
                          break
                  out[str(port)] = state
              return out
          hosts = [l.split() for l in open(sys.argv[1]) if len(l.split()) == 4]
          tried = [h for h in hosts if h[1] != "-"]
          with ThreadPoolExecutor(max_workers=len(tried)) as pool:
              done = list(pool.map(lambda h: knock(h[1], [int(p) for p in h[2].split(",")]), tried))
          out = {h[0]: None for h in hosts}
          out.update({h[0]: r for h, r in zip(tried, done)})
          print(json.dumps(out))
          PY

          # pick.py <n> [controls] — the controls first (comma-separated, every
          # one, even without a config: the loop then records it as not tested),
          # then n configs at random, a different city first. With no controls
          # it is the old rule: never the first config alphabetically.
          cat > /tmp/pick.py <<'PY'
          import os, random, sys
          n = int(sys.argv[1])
          names = sorted(f[:-5] for f in os.listdir("/etc/wireguard") if f.endswith(".conf"))
          controls = [c for c in (sys.argv[2].split(",") if len(sys.argv) > 2 else []) if c]
          pool = [x for x in names if x not in controls] if controls else names[1:]
          rng = random.SystemRandom()
          rng.shuffle(pool)
          by_city = {}
          for name in pool:
              by_city.setdefault("-".join(name.split("-")[:2]), []).append(name)
          picks = [servers[0] for servers in by_city.values()][:n]
          rest = [x for x in pool if x not in picks]
          picks += rest[: n - len(picks)]
          print("\n".join(controls + picks))
          PY

          exit_ip () {   # the current exit address, or empty
            local p ip
            for p in https://api.ipify.org https://ifconfig.me https://icanhazip.com; do
              ip=$(curl -s --max-time 8 "$p" 2>/dev/null | head -1 | tr -d '[:space:]' || true)
              if [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "$ip"; return; fi
            done
            echo ""
          }

          record () {   # record <n> <route> <note> <hosts-json-or-empty>
            python3 - "$1" "$2" "$3" "${4:-}" >> "$RESULTS" <<'PY'
          import json, sys
          n, route, note, hosts = sys.argv[1:5]
          print(json.dumps({"n": n, "route": route, "note": note,
                            "hosts": json.loads(hosts) if hosts else None}))
          PY
          }

          BASE_IP=$(exit_ip)
          [[ -n "$BASE_IP" ]] || { echo "::error::could not read GitHub's own address — nothing tested"; exit 1; }
          echo "::add-mask::$BASE_IP"

          echo "── control: GitHub's own address (no tunnel)"
          hosts=$(python3 /tmp/knock.py /tmp/targets.resolved)
          echo "   $hosts"
          record "control" "GitHub's own address" "" "$hosts"

          SEEN=" $BASE_IP "
          i=0
          for R in $(sudo python3 /tmp/pick.py "$EXITS" "$CONTROLS"); do
            i=$((i + 1))
            echo "── exit $i: $R"
            if ! sudo test -f "/etc/wireguard/$R.conf"; then
              echo "   no config for this exit — not tested"
              record "$i" "$R" "no config for this exit" ""
              continue
            fi
            sudo chmod 0644 "/etc/wireguard/$R.conf"
            # Its log names the server's address, so it stays in /tmp, unprinted.
            # shellcheck disable=SC2024
            if ! sudo scripts/scanner/wg_up_userspace.sh "$R" > /tmp/wgup.log 2>&1; then
              echo "   tunnel did not come up — not tested"
              record "$i" "$R" "tunnel did not come up" ""
              sudo scripts/scanner/vpn_teardown.sh > /dev/null 2>&1 || true
              continue
            fi
            IP=$(exit_ip)
            if [[ -z "$IP" ]]; then
              echo "   could not read the exit address — not tested"
              record "$i" "$R" "could not read the exit address" ""
            elif [[ "$IP" == "$BASE_IP" ]]; then
              echo "   the exit did not change — not tested"
              record "$i" "$R" "the exit did not change" ""
            else
              echo "::add-mask::$IP"
              note=""
              case "$SEEN" in *" $IP "*) note="same exit address as an earlier route" ;; esac
              SEEN="$SEEN$IP "
              hosts=$(python3 /tmp/knock.py /tmp/targets.resolved)
              echo "   $hosts${note:+  ($note)}"
              record "$i" "$R" "$note" "$hosts"
            fi
            sudo scripts/scanner/vpn_teardown.sh > /dev/null 2>&1 || true
            sleep 3
          done

      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          [[ -s /tmp/reach.jsonl && -s /tmp/targets.resolved ]] || { echo "no results to summarize"; exit 0; }
          python3 - /tmp/reach.jsonl /tmp/targets.resolved "$TARGET" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          rows = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          # name, ports, network; the address column is never read or printed
          hosts = [(p[0], p[2].split(","), p[3]) for p in
                   (l.split() for l in open(sys.argv[2])) if len(p) == 4]
          CITY = {"atl": "Atlanta", "bos": "Boston", "chi": "Chicago", "dal": "Dallas",
                  "den": "Denver", "det": "Detroit", "hou": "Houston", "lax": "Los Angeles",
                  "mia": "Miami", "nyc": "New York", "phx": "Phoenix", "qas": "Ashburn",
                  "rag": "Raleigh", "sea": "Seattle", "sjc": "San Jose",
                  "slc": "Salt Lake City", "uyk": "Secaucus"}
          ROLE = {"us-chi-wg-304": "the deep scans' exit since Nov 2",
                  "us-chi-wg-201": "the deep scans' exit until Nov 2"}
          def city(route):
              parts = route.split("-")
              if len(parts) < 2:
                  return "—"
              name = CITY.get(parts[1]) if parts[0] == "us" else None
              return name or f"{parts[0].upper()} {parts[1]}"
          def answers(states):   # open or refused: something answered
              return states is not None and any(s in ("open", "refused") for s in states.values())
          vpn = [r for r in rows if r["n"] != "control"]
          tested = [r for r in vpn if r["hosts"] is not None]
          if len(hosts) == 1:
              # one host: the table as it was before both-networks
              name, ports, _ = hosts[0]
              def verdict(r):
                  if r["hosts"] is None:
                      return "not tested: " + r["note"]
                  p = r["hosts"].get(name)
                  if p is None:
                      return "not tested: could not resolve"
                  v = list(p.values())
                  if "open" in v:
                      return "✅ gets through"
                  if "refused" in v:
                      return "✅ answers (port closed)"
                  return "❌ silent"
              print("## Can other Mullvad exits reach the box?")
              print()
              print(f"Target: {name}. "
                    f"Ports tried: {', '.join(ports)}. A plain connect, then close; nothing sent. "
                    "Addresses are not printed (public log).")
              print()
              print("| # | Route | City | " + " | ".join(ports) + " | Result |")
              print("|---|---|---|" + "---|" * len(ports) + "---|")
              for r in rows:
                  cells = [((r["hosts"] or {}).get(name) or {}).get(p, "—") for p in ports]
                  where = "—" if r["n"] == "control" else city(r["route"])
                  print(f"| {r['n']} | {r['route']} | {where} | " + " | ".join(cells) + f" | {verdict(r)} |")
              through = [r for r in tested if answers(r["hosts"].get(name))]
              print()
              print(f"**Mullvad exits that reached the box: {len(through)} of {len(tested)} tested** "
                    f"({len(vpn) - len(tested)} could not be tested).")
              sys.exit(0)
          # several hosts: one row per route, one column per host
          nets = []
          for _, _, net in hosts:
              if net not in nets:
                  nets.append(net)
          short = [h[0].rsplit(".", 1)[0] for h in hosts]
          print("## Which Mullvad exits reach both networks?")
          print()
          print("Hosts: " + "; ".join(f"{n} ({net}, ports {','.join(p)})" for n, p, net in hosts) + ". "
                "A plain connect to each port, then close; nothing sent. ✅ = a port answered "
                "(open or refused), ❌ = no port answered, — = not tried. "
                "Addresses are not printed (public log).")
          print()
          print("| # | Route | City | " + " | ".join(short) + " | " + " | ".join(nets) + " |")
          print("|---|---|---|" + "---|" * (len(hosts) + len(nets)))
          for r in rows:
              res = r["hosts"]
              if r["n"] == "control":
                  route, where = r["route"], "—"
              else:
                  route = r["route"] + (f" ({ROLE[r['route']]})" if r["route"] in ROLE else "")
                  where = city(r["route"])
              if res is None:
                  print(f"| {r['n']} | {route}, not tested: {r['note']} | {where} | "
                        + " | ".join(["—"] * (len(hosts) + len(nets))) + " |")
                  continue
              cells = ["—" if res.get(n) is None else ("✅" if answers(res.get(n)) else "❌") for n, _, _ in hosts]
              per = []
              for net in nets:
                  mine = [n for n, _, nt in hosts if nt == net and res.get(n) is not None]
                  per.append(f"{sum(answers(res.get(n)) for n in mine)} of {len(mine)}" if mine else "—")
              print(f"| {r['n']} | {route} | {where} | " + " | ".join(cells) + " | " + " | ".join(per) + " |")
          # A host no route reached says nothing about the exits; it is named, not counted.
          seen = {n for r in rows if r["hosts"] for n, _, _ in hosts if answers(r["hosts"].get(n))}
          dark = [n for n, _, _ in hosts if n not in seen]
          full = [r["route"] for r in tested
                  if all(answers(r["hosts"].get(n)) for n in seen if r["hosts"].get(n) is not None)]
          print()
          if not seen:
              print("**No route reached any of these hosts**, so no exit is counted as reaching them "
                    f"({len(tested)} tested, {len(vpn) - len(tested)} could not be tested).")
              sys.exit(0)
          if dark:
              print("No route reached " + ", ".join(dark) + ", so it is left out of the count below.")
              print()
          print(f"**Mullvad exits that reached every host some route reached: {len(full)} of {len(tested)} tested** "
                f"({len(vpn) - len(tested)} could not be tested)" + (": " + ", ".join(full) if full else "") + ".")
          PY

      - name: Tear down any tunnel left up
        if: always()
        run: sudo scripts/scanner/vpn_teardown.sh > /dev/null 2>&1 || true
