name: Toolchain inventory

# Capture the EXACT versions and flag sets of every scanning tool in the
# running scanner image.
#
# WHY THIS EXISTS (2026-09-07). docker/Dockerfile installs all ten scanning
# tools with `@latest`, the image is published as `:latest`, and nuclei
# templates are refreshed with `-update-templates` at build time. Three
# independent floating layers. Consequences:
#
#   * A finding can disappear because a nuclei template was renamed or
#     dropped upstream, and the finding lifecycle records that as
#     REMEDIATION. That is a false-remediation path no gate can catch,
#     because the scan itself ran perfectly.
#   * Every coverage measurement in specs 227-231 assumes stable tool
#     behaviour. `wall_clock_cut_400s at 78%` can move with a nuclei
#     release and nothing in our code changes.
#   * Probe flags can change under us, which is what blocked the
#     curl -> Go-stack migration (spec 231): no way to know which httpx
#     flags the installed build actually supports.
#
# This workflow is the ground truth we pin FROM, and the thing to re-run
# whenever a deliberate bump happens. Read-only; it changes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bklynhowster/commandsentry-scanner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Tool versions
        # Never let one tool's exit code kill the inventory — several PD
        # tools print version to stderr and exit non-zero. We want the
        # whole picture, including which ones misbehave.
        run: |
          set +e
          echo "=============================================="
          echo " TOOL VERSIONS  (pin the Dockerfile to these)"
          echo "=============================================="
          # ⚠ grep for the version line, do NOT `head` the raw output.
          # dnsx / httpx / naabu / katana print a multi-line ASCII banner
          # BEFORE the version, so `head -5` silently cut the only line that
          # mattered on the first run of this workflow (2026-09-07). Filtering
          # on the text we actually want is immune to banner height.
          #
          # ⚠ And there is no universal version flag. Run #2 (2026-09-07)
          # proved it: ffuf rejects -version (wants -V), fingerprintx rejects
          # both -version and --version (cobra: "unknown flag"). Two of the
          # ten tools returned NOTHING, which is the failure that matters —
          # an empty answer here reads as "no version" and would have shipped
          # an incomplete pin. So: try every flag form, then fall back to a
          # method that cannot depend on the tool's CLI at all.
          #
          # THE FALLBACK. Every Go binary embeds its own build info, and the
          # main module record is literally `mod<TAB>module/path<TAB>vX.Y.Z`.
          # We read it straight out of the executable — no Go toolchain
          # required, which matters because the runtime stage deliberately has
          # none (binaries are built in the builder stage). This is ground
          # truth about the shipped artifact rather than whatever the tool
          # chooses to print about itself.
          #
          # ⚠ `tr` first, then grep. Do NOT try to match the tabs with one
          # clever regex: that regex cannot be tested anywhere outside this
          # image, and a pattern that silently matches nothing looks exactly
          # like "this tool has no version" — which is the failure that has
          # already cost this workflow two runs. `tr -c '[:print:]' '\n'`
          # turns every non-printable byte (tabs included) into a newline, so
          # the record becomes three plain lines: mod / path / version. Then
          # `grep -A2 '^mod$'` needs no cleverness at all.
          # ⚠ Do NOT use -m1 here. Run #3 (2026-09-07) proved why: nuclei and
          # katana both contain an earlier literal `mod` line somewhere in
          # their data, so first-match returned `mod @` and `mod  H` — not
          # empty, just garbage, which is worse because the empty-fallback
          # never fired. Take EVERY `^mod$` window and keep only the lines
          # that actually look like a module path or a version; the junk
          # windows filter themselves out.
          go_module_version() {
            b=$(command -v "$1" 2>/dev/null)
            if [ -z "$b" ]; then echo "(not on PATH)"; return; fi
            info=$(tr -c '[:print:]' '\n' < "$b" \
                   | grep -a -A2 '^mod$' \
                   | grep -aE '^([a-z0-9.-]+\.[a-z]{2,}/|v[0-9]+\.)' \
                   | head -4 | tr '\n' ' ')
            if [ -n "$info" ]; then
              echo "$info"
            else
              # Never return empty. An empty answer is indistinguishable from
              # "no version exists" and would ship an incomplete pin.
              echo "(no Go build-info record found — raw candidates:)"
              tr -c '[:print:]' '\n' < "$b" \
                | grep -aE "^(v[0-9]+\.[0-9]+|go1\.|github\.com/)" | head -6 \
                | sed 's/^/      /'
            fi
          }

          for t in subfinder dnsx httpx naabu nuclei katana fingerprintx ffuf gau; do
            printf '\n----- %s -----\n' "$t"
            # ⚠ flags only — never a bare `version` subcommand. gau and
            # subfinder take positional/stdin targets, so `gau version`
            # would go scan a "domain" called version. `< /dev/null` for the
            # same reason: a flag that turns out to mean something other than
            # version must not leave the tool blocking on stdin.
            out=$("$t" -version 2>&1 </dev/null; "$t" --version 2>&1 </dev/null; "$t" -V 2>&1 </dev/null)
            echo "$out" | grep -iE "current version|engine version|^v?[0-9]+\.[0-9]+" \
              | grep -viE "^ *$" | head -4
            # Always print the embedded module version too. It is the pin we
            # actually copy into the Dockerfile, and it is the only line that
            # exists for the tools whose CLI refuses to tell us.
            printf '  [embedded] '; go_module_version "$t" || echo "(no build info found)"
          done
          # ⚠ wireguard-go needs the embedded record too, and it is the one
          # tool where the two numbers are not even the same SCHEME. The
          # binary prints its own release string ("v0.0.20250522"); the Go
          # module has no tags at all, so it pins as a pseudo-version
          # ("v0.0.0-20260522210424-<hash>"). You cannot derive one from the
          # other, and this is the VPN egress keystone — not a thing to guess.
          printf '\n----- wireguard-go -----\n'
          wireguard-go --version 2>&1 | head -3
          printf '  [embedded] '; go_module_version wireguard-go
          printf '\n----- wg -----\n';           wg --version 2>&1 | head -3
          printf '\n----- nikto -----\n';        nikto -Version 2>&1 | head -8
          printf '\n----- wafw00f -----\n';      wafw00f --version 2>&1 | head -3
          printf '\n----- testssl -----\n';      testssl.sh --version 2>&1 | head -5
          exit 0

      - name: httpx JSON shape for the curl -> Go-stack migration (spec 231 / ㊴)
        # ⚠ THIS STEP MAKES ONE OUTBOUND REQUEST. Every other step here is
        # offline. Target is an OWNED Prodex asset under standing ROE, and it
        # is a single GET — the same request the light tier already makes on
        # every sweep. Zero incremental exposure.
        #
        # WHY. ㊴ migrates light's header/body probes from curl to httpx. The
        # FLAGS are known (-irh puts response headers in -json output) but the
        # JSON SHAPE is not: no httpx consumer in this repo reads a header map,
        # so there is no in-repo precedent for the key name or its casing.
        # Writing a parser against a guessed key is exactly the guess that cost
        # spec 233. Capture the real shape, THEN write the parser.
        #
        # jq, not python: an inline python heredoc at column 0 breaks the YAML
        # block scalar (learned the hard way on this very step).
        run: |
          set +e
          TARGET="https://www.prodexlabs.com"

          echo "=== 1. top-level keys returned by  httpx -json -irh -sc ==="
          OUT=$(httpx -u "$TARGET" -silent -no-color -json -irh -sc -timeout 15 2>/dev/null | head -1)
          if [ -z "$OUT" ]; then
            echo "NO OUTPUT -- httpx returned nothing. Do NOT infer a shape from this."
            exit 0
          fi
          echo "$OUT" | jq -r 'to_entries | map("\(.key)  [\(.value|type)]") | sort | .[]'

          echo
          echo "=== 2. which key holds the header map, and is it dict or blob? ==="
          echo "$OUT" | jq -r '
            to_entries
            | map(select(.key | test("header|raw"; "i")))
            | if length == 0 then
                "NONE -- -irh did not add a header key. The parser CANNOT be written yet."
              else
                map("\(.key) is \(.value|type)") | .[]
              end'

          echo
          echo "=== 3. header key names as httpx emits them (CASING MATTERS) ==="
          echo "$OUT" | jq -r '
            to_entries
            | map(select((.key | test("header"; "i")) and (.value|type=="object")))
            | .[0].value // {}
            | keys | .[]' | head -25

          echo
          echo "=== 4. status_code key name + type (for common_paths) ==="
          echo "$OUT" | jq -r 'to_entries | map(select(.key|test("status"))) | map("\(.key) = \(.value) [\(.value|type)]") | .[]'
          exit 0

      - name: httpx -irr BODY shape (common_paths + wpvulnerability, ㊴ probes 2+3)
        # ⚠ ONE more outbound GET, same OWNED Prodex asset as the step above,
        # same single-GET shape the light tier already performs every sweep.
        #
        # WHY A SECOND CAPTURE. The step above captured `-irh` (headers only).
        # The two remaining ㊴ probes need the RESPONSE BODY, which is a
        # different flag (`-irr`) and therefore a different, UNKNOWN JSON shape:
        #
        #   * common_paths  -> _probe_path_body() returns (status, body, ctype).
        #     The body is load-bearing: it feeds the catch-all baseline sha256
        #     AND verify_secret_content() for HIGH paths. A wrong body key does
        #     not fail loudly — it makes every body empty, which makes every
        #     hash equal, which makes EVERY host look like a catch-all and
        #     SUPPRESSES real /.env findings. Silent, and in the dangerous
        #     direction (fewer findings, all phases still ok).
        #   * wpvulnerability -> homepage fetch for WP version detection. An
        #     empty body reads as "not WordPress" and skips the CVE lookup,
        #     which `wpvuln_lookup_is_degraded` classifies as HEALTHY.
        #
        # So a guessed key silently DELETES coverage in both. Capture first.
        # This is the same discipline that caught the header underscore trap:
        # the `-irh` capture is the only reason ㊴ probe 1 did not ship seven
        # fabricated findings per asset fleet-wide.
        # 🔴 RUN #7 RESULT (2026-09-09): `-irr` IS NOT PARSEABLE JSON.
        #
        #   jq: parse error: Invalid string: control characters from U+0000
        #   through U+001F must be escaped at line 3, column 5707
        #
        # httpx embeds the raw response with LITERAL control bytes (CR/LF)
        # inside a JSON string value, unescaped. jq refuses it, and Python's
        # json.loads refuses it too by default (strict=True rejects control
        # characters in strings). Had the parser been written from a guess,
        # common_paths would have thrown or silently produced empty bodies on
        # EVERY asset — every catch-all hash equal, every host a "catch-all",
        # real /.env findings suppressed, all phases still ok.
        #
        # The -h dump in the next step gives the actual answer:
        #   -irrb, -include-response-base64   base64 encoded http request/response
        #   -hash string                      response body hash (md5..sha512)
        #   -ct,  -content-type               display response content-type
        #   -bp,  -body-preview               first N chars of response body
        #
        # ⚠ TWO THINGS STILL UNKNOWN, and both are load-bearing:
        #   (a) Does the -irrb blob contain the REQUEST too, and/or the
        #       RESPONSE HEADERS? _body_sha() must hash the BODY ONLY. A hash
        #       over anything containing Date/Set-Cookie changes on every
        #       request, so the two catch-all control probes would never match
        #       each other, catch-all detection would silently switch OFF, and
        #       suppression would stop — noisy rather than dangerous, but wrong.
        #   (b) Is `-hash sha256` body-only and therefore stable? If so it
        #       replaces _body_sha entirely and we never need the body for the
        #       baseline at all — only for HIGH-path marker verification.
        # Test (b) by hashing the SAME url TWICE and comparing.
        run: |
          set +e
          TARGET="https://www.prodexlabs.com"

          echo "=== 1. -irrb : keys, types, sizes (base64 => jq-safe) ==="
          B=$(httpx -u "$TARGET" -silent -no-color -json -irrb -sc -ct -timeout 15 2>/dev/null | head -1)
          if [ -z "$B" ]; then
            echo "NO OUTPUT with -irrb. STOP — do not infer a shape."
          else
            echo "$B" | jq -r 'to_entries
              | map("\(.key)  [\(.value|type)]  len=\(
                  if (.value|type)=="string" then (.value|length)
                  elif (.value|type)=="object" then (.value|keys|length)
                  else 0 end)")
              | sort | .[]' || echo "jq FAILED on -irrb too — report verbatim."

            echo
            echo "=== 2. decode each long base64 field: REQUEST? HEADERS? BODY? ==="
            # This is question (a). If the decoded text starts with 'GET / HTTP'
            # it is the REQUEST. If it starts with 'HTTP/1.1 200' it is the
            # response WITH headers. If it starts with '<!DOCTYPE' it is a
            # clean body.
            for K in $(echo "$B" | jq -r 'to_entries
                        | map(select((.value|type)=="string" and (.value|length) > 200))
                        | map(.key) | .[]'); do
              echo "--- $K (first 200 chars decoded) ---"
              echo "$B" | jq -r --arg k "$K" '.[$k]' | base64 -d 2>/dev/null | head -c 200
              echo
              echo "--- $K : does it contain a Date header? (volatile => unusable for hashing) ---"
              echo "$B" | jq -r --arg k "$K" '.[$k]' | base64 -d 2>/dev/null \
                | head -40 | grep -iE "^(date|set-cookie|GET |POST |HTTP/)" | head -5
              echo
            done
          fi

          echo
          echo "=== 3. status_code + content_type as -irrb exposes them ==="
          # _probe_path_body compares `code not in (200, 204, 206)` against an
          # int tuple; a string status_code silently never matches.
          echo "$B" | jq -r '"status_code=\(.status_code) [\(.status_code|type)]"'
          echo "$B" | jq -r '[ (.content_type // empty), (.header.content_type // empty) ]
                              | if length==0 then "content_type NOT FOUND" else .[] end'

          echo
          echo "=== 4. -hash sha256 : field name, and is it STABLE across 2 runs? ==="
          # Question (b). Two independent requests to the same URL. If the two
          # hashes MATCH, the hash is body-only and can replace _body_sha for
          # the catch-all baseline. If they DIFFER, it includes volatile
          # headers and must NOT be used for catch-all detection.
          H1=$(httpx -u "$TARGET" -silent -no-color -json -hash sha256 -timeout 15 2>/dev/null | head -1)
          sleep 2
          H2=$(httpx -u "$TARGET" -silent -no-color -json -hash sha256 -timeout 15 2>/dev/null | head -1)
          echo "hash-bearing keys in run 1:"
          echo "$H1" | jq -r 'to_entries | map(select(.key|test("hash"))) | map("  \(.key) = \(.value|tostring)") | .[]'
          V1=$(echo "$H1" | jq -r '[.. | strings] | map(select(test("^[0-9a-f]{64}$"))) | .[0] // "none"')
          V2=$(echo "$H2" | jq -r '[.. | strings] | map(select(test("^[0-9a-f]{64}$"))) | .[0] // "none"')
          echo "  run1 sha256=$V1"
          echo "  run2 sha256=$V2"
          if [ "$V1" = "$V2" ] && [ "$V1" != "none" ]; then
            echo "  => STABLE. Body-only. CAN replace _body_sha for the catch-all baseline."
          else
            echo "  => UNSTABLE or absent. Do NOT use for catch-all detection."
          fi
          exit 0

      - name: httpx redirect shape (㊴ probe 3, wpvulnerability)
        # ⚠ ONE outbound GET to an OWNED Command asset under standing ROE.
        #
        # WHY. probe 3 is wpvulnerability's homepage fetch, and it is the ONLY
        # light probe whose curl carries `-L` (follow redirects). Probes 1 and 2
        # had no -L, so they ported without touching redirect semantics. This
        # one cannot.
        #
        # The constraint is NOT "don't follow redirects". It is:
        #   ⛔ never follow a redirect off eTLD+1
        # (ratified; two assets redirect to login.microsoftonline.com, and
        # grading Microsoft's homepage as our asset is the failure mode).
        #
        # httpx offers only two settings, and NEITHER is the rule we need:
        #   -fr,  -follow-redirects        follow everything, including offsite
        #   -fhr, -follow-host-redirects   same HOST only
        #
        # -fhr is too tight: www.commandcompanies.com -> commandcompanies.com is
        # a different HOST but the same eTLD+1. Using -fhr would stop following
        # it, the homepage would be a 301 stub, "wp-content" would be absent,
        # and wpvulnerability would conclude "not a WordPress site" and
        # mark_tool_ok -- silently dropping WP CVE coverage on the 4 www assets
        # that have an apex sibling. A HEALTHY-looking total loss of coverage.
        #
        # So: use -fr and enforce eTLD+1 ourselves. That needs the FINAL url
        # after redirects, and it is not yet known which field carries it.
        # `input` and `url` were both captured at len=26 on a NON-redirecting
        # target, so they are indistinguishable there. Resolve it against a
        # KNOWN redirector.
        run: |
          set +e
          TARGET="https://www.commandcompanies.com/"
          echo "target (known www -> apex redirector): $TARGET"

          echo
          echo "=== A. NO -fr (baseline: what a 301 stub looks like) ==="
          A=$(httpx -u "$TARGET" -silent -no-color -json -sc -timeout 15 2>/dev/null | head -1)
          echo "$A" | jq -r '"status_code=\(.status_code)  input=\(.input)  url=\(.url)  location=\(.location // "<none>")"'

          echo
          echo "=== B. WITH -fr (which field becomes the FINAL url?) ==="
          B=$(httpx -u "$TARGET" -silent -no-color -json -sc -fr -timeout 15 2>/dev/null | head -1)
          echo "$B" | jq -r '"status_code=\(.status_code)  input=\(.input)  url=\(.url)  location=\(.location // "<none>")"'
          echo "  -> if url differs from input above, the url field is the FINAL url"
          echo "     and is what the eTLD+1 guard must test. If equal, use -include-chain."

          echo
          echo "=== C. -fr -include-chain (fallback if B was ambiguous) ==="
          C=$(httpx -u "$TARGET" -silent -no-color -json -sc -fr -include-chain -timeout 15 2>/dev/null | head -1)
          echo "$C" | jq -r 'to_entries
            | map(select(.key | test("chain|redirect|location|url|input")))
            | map("  \(.key) [\(.value|type)] = \(.value|tostring|.[0:160])") | .[]'

          echo
          echo "=== D. does -fr change whether the body looks like WordPress? ==="
          # The actual thing probe 3 depends on: 'wp-content' present in the body.
          for FLAG in "" "-fr"; do
            R=$(httpx -u "$TARGET" -silent -no-color -json -irrb $FLAG -timeout 15 2>/dev/null | head -1)
            N=$(echo "$R" | jq -r '.body // ""' | base64 -d 2>/dev/null | grep -c "wp-content")
            echo "  flags='$FLAG'  wp-content occurrences in decoded body: $N"
          done
          exit 0

      - name: Nuclei template version
        # Templates float SEPARATELY from the nuclei binary: the Dockerfile
        # runs `nuclei -update-templates` at build time. Pinning the binary
        # alone does not pin what it scans FOR.
        run: |
          set +e
          echo "=== nuclei -templates-version ==="
          nuclei -templates-version 2>&1 | head -10
          echo
          echo "=== template dir + count ==="
          for d in /root/nuclei-templates "$HOME/nuclei-templates" /nuclei-templates; do
            [ -d "$d" ] && { echo "$d"; find "$d" -name '*.yaml' | wc -l; break; }
          done
          exit 0

      - name: Nuclei corpus identity (#31 probe — capture, do NOT guess)
        # #31 must record WHICH template corpus a scan actually ran against.
        # Two verified facts make that harder than it looks:
        #   * `nuclei -templates-version` prints an EMPTY string (see the step
        #     above, and docker/Dockerfile records the same) — there is no
        #     version string to read.
        #   * `RUN nuclei -update-templates -silent 2>/dev/null || true` is
        #     FAIL-SILENT, so the corpus PRESENT can differ from the corpus the
        #     build intended to fetch with nothing anywhere recording that it
        #     did. The stamp therefore has to describe what is present at scan
        #     time, not what the build asked for.
        # There is NO in-repo precedent for a template-listing flag, so this
        # step captures the real shape rather than shipping a guessed one —
        # the same discipline that produced the httpx `-irrb` finding.
        run: |
          set +e
          echo "=== does a template-list flag exist in this nuclei? ==="
          nuclei -h 2>&1 | grep -iE "tl,|-tl\b|template-list|list.*template|templates-version" | head -20
          echo
          echo "=== PLAN-CLASS COUNTS — the exact two branches run_medium.py:3032 picks ==="
          echo "-- FULL plan (non-WAF):  -severity critical,high -exclude-tags dos"
          nuclei -tl -severity critical,high -exclude-tags dos 2>/dev/null | wc -l
          echo "-- REDUCED plan (WAF):   -severity critical,high -exclude-tags intrusive,dos,fuzz"
          nuclei -tl -severity critical,high -exclude-tags intrusive,dos,fuzz 2>/dev/null | wc -l
          echo "   ^^ if both read 0 the flag is unsupported and the stamp needs another source."
          echo "   These two counts are what the 7255 : 9039 ratio has to be tested against."
          echo
          echo "=== corpus identity candidates ==="
          D=""
          for d in /root/nuclei-templates "$HOME/nuclei-templates" /nuclei-templates; do
            [ -d "$d" ] && { D="$d"; break; }
          done
          echo "dir=$D"
          if [ -n "$D" ]; then
            echo "-- git ref (is it a clone?):"
            git -C "$D" rev-parse HEAD 2>&1 | head -2
            echo "-- top-level entries incl. dotfiles:"
            ls -a "$D" 2>/dev/null | head -25
            echo "-- yaml count:"
            find "$D" -name '*.yaml' | wc -l
            echo "-- deterministic path hash (detects add/remove, not edits):"
            find "$D" -name '*.yaml' -printf '%P\n' 2>/dev/null | LC_ALL=C sort | sha256sum
          fi
          echo
          echo "=== nuclei config dir (may carry a fetched-version record) ==="
          for c in "$HOME/.config/nuclei" /root/.config/nuclei; do
            if [ -d "$c" ]; then
              echo "$c"; ls -a "$c" 2>/dev/null
              for f in "$c"/*.json "$c"/.*.json; do
                [ -f "$f" ] && { echo "--- $f"; head -c 600 "$f"; echo; }
              done
            fi
          done
          exit 0

      - name: httpx flag set
        # THE SPEC-231 BLOCKER. The curl -> Go-stack migration needs httpx to
        # return RESPONSE HEADERS (check_headers needs the security-header
        # set; check_methods needs `Allow` from OPTIONS). No existing httpx
        # call in this repo retrieves headers, so there is no in-repo
        # precedent for the flag. Capture the real one rather than guess —
        # a guessed flag ships a probe that fails on the runner.
        run: |
          set +e
          echo "=== httpx -h (FULL) ==="
          httpx -h 2>&1
          echo
          echo "=== grep: header / method / response-body flags ==="
          httpx -h 2>&1 | grep -iE "header|method|response|body|store|json" || true
          exit 0

      - name: Image provenance
        run: |
          set +e
          echo "=== image digest / labels ==="
          cat /etc/os-release 2>/dev/null | head -3
          echo "GITHUB_SHA=$GITHUB_SHA"
          exit 0
