name: tests

# Added 2026-07-29. Until now NOTHING in either repo ran a test — ~37 test
# files, `pytest` appeared zero times across .github/workflows/. The gate
# regression tests exist specifically to catch a fail-open coming back, and
# nothing ran them, which is not a control.
#
# What the first run of this workflow found, against code that was fine:
#   - 5 stale tests asserting contracts renamed on 07-24/07-25
#   - test_ledger_gate_mechanism.py had NEVER been runnable (committed
#     without its fixtures; died on IndexError before assertion one)
#   - 3 "unit" tests making live socket calls to demo.example.com
#   - a production function (testssl_is_degraded) collected as a test case
#   - a live-DB write tool named test_* that pytest would happily execute
#
# All of it had been sitting there for days. That is the argument for this file.

on:
  push:
    branches: [main]
    # Scans commit asset JSON back to main constantly. Testing those commits
    # wastes minutes and trains everyone to ignore the badge.
    paths-ignore:
      - 'data/**'
      - 'web/data/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Lane 5 — INSTANCE-DIVERGENCE GUARD (relay 160/161, 2026-09-15)
  #
  # ⛔ WHY THIS EXISTS. On 2026-09-15 a "parity port" copied run_light.py,
  # run_medium.py and run_heavy.py wholesale from Command to Prodex instead of
  # applying the three edits. It destroyed Prodex's entire P1a targeted-scan layer
  # (exposure_to_finding, whose docstring calls its source override the isolation
  # "that guarantees no false-close"), the scan_plan/scan_profile fields, and
  # Prodex's own DEFAULT_SUPABASE_URL. It reached main.
  #
  # Three instruments were silent: the unit suite does not exercise the P1a
  # dispatch path; test_phase_registry's superset check compares each repo AGAINST
  # ITSELF, so a wholesale overwrite is internally consistent and invisible to it;
  # and the one visible signal — the skip count moving 6 -> 8, i.e. Command's test
  # population arriving with Command's files — was reported as a pass.
  #
  # The deleted code CARRIED ITS OWN WARNING:
  #   "PRODEX-ONLY (Command's run_medium.ScanContext has neither — verified
  #    2026-08-29). Legitimate instance divergence, not a parity violation."
  # The marker existed, said exactly the right thing, and nothing read it — a
  # producer-without-consumer in the comments. This lane is the consumer.
  #
  # ⚠ NO HAND-MAINTAINED ALLOWLIST, deliberately. Lane 4's list of directories
  # rotted twice in 24 hours. This reads markers that already live next to the
  # code they protect, so adding protected code is a comment, not a registry edit.
  #
  # ⚠ DIFFS AGAINST THE PRE-CHANGE TREE, never repo-against-repo. Comparing the
  # two repos is exactly the check that reported success while the damage was in
  # flight — both repos agreed, because one had overwritten the other.
  divergence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the pre-change tree must be reachable. The default
          # depth-1 checkout cannot diff against anything.
          fetch-depth: 0

      - name: Protected instance-divergence markers must not be deleted
        env:
          MARKERS: 'PRODEX-ONLY|COMMAND-ONLY|Legitimate instance divergence'
        run: |
          set -uo pipefail

          # Resolve the pre-change ref. push -> event.before; PR -> merge base.
          BEFORE="${{ github.event.before || '' }}"
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || true)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE=""
          fi

          # ⛔ FAIL-OPEN IS WRONG HERE, but so is failing a first push / force-push
          # with no resolvable base. Skip LOUDLY so the gap is visible in the log
          # rather than being mistaken for a pass.
          if [ -z "$BASE" ]; then
            echo "::warning::no pre-change ref resolvable (first push, force-push, or shallow) — divergence guard SKIPPED, not passed"
            exit 0
          fi
          echo "diffing $BASE..HEAD for deleted protected markers"

          # Deleted lines only (^-), excluding the ---/+++ file headers, that
          # carry a protected marker. -U0 so context lines can't be mistaken for
          # deletions.
          DELETED=$(git diff -U0 "$BASE"..HEAD -- '*.py' '*.sh' '*.ts' '*.tsx' '*.yml' \
                    | grep -E "^-" | grep -vE "^---" | grep -E "$MARKERS" || true)

          if [ -z "$DELETED" ]; then
            echo "no protected divergence markers deleted"
            exit 0
          fi

          echo "::error::A protected instance-divergence marker was DELETED. A parity port applies the EDIT, never the FILE."
          # Name the file and the line for every hit — a guard that says only
          # "something broke" gets ignored.
          git diff -U0 "$BASE"..HEAD -- '*.py' '*.sh' '*.ts' '*.tsx' '*.yml' \
            | awk -v pat="$MARKERS" '
                /^\+\+\+ b\// { file=substr($0,7) }
                /^@@/            { split($0,a,"-"); split(a[2],b,","); ln=b[1]+0 }
                /^-/ && !/^---/  { if ($0 ~ pat) printf "::error file=%s,line=%d::deleted protected line: %s\n", file, ln, substr($0,2) }
              '
          echo ""
          echo "If this divergence is genuinely being retired, delete the marker in its OWN"
          echo "commit with the reasoning — not as a side effect of a port."
          exit 1

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Both suites import modules by bare name (`import gate_retry`,
      # `import roe_gate`) rather than as a package. Set the path once here
      # instead of making every test file guess.
      PYTHONPATH: >-
        ${{ github.workspace }}/scripts/common:${{ github.workspace }}/scripts/scanner:${{
        github.workspace }}/scripts/db:${{ github.workspace }}/scripts/normalize
      # Belt and braces: no DSN is available to this job, and nothing here
      # should ever want one. If a test starts failing for want of a DSN it is
      # an integration test in the wrong lane — move it, don't add a secret.
      SUPABASE_DSN: ""
      # ── THE ROOTS pytest IS POINTED AT. Defined ONCE, used three times:
      #    lane 0's find, lane 1's pytest, lane 4's orphan pattern.
      # Before 2026-09-15 lane 4 restated these as a hand-written list of
      # subdirectories and it went stale TWICE IN 24 HOURS (scripts/alerter,
      # then scripts/backfill) — two red builds, nothing actually wrong either
      # time, because lane 1 globs `scripts` RECURSIVELY and was already
      # running both. A list that gates nothing but fires anyway is not a
      # tripwire, it is noise with a good name.
      PYTEST_ROOTS: "scanner scripts"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # matches the scanner container image

      - name: Install test deps
        # psycopg IS required, and the first CI run is what proved it.
        #
        # This step originally installed pytest only, on the reasoning that the
        # tests stub psycopg and installing it "invites a test to open a real
        # connection." That was clever and wrong. Ten production modules do:
        #
        #     try: import psycopg
        #     except ImportError: print(...); sys.exit(1)
        #
        # — a sensible fail-fast for a CLI, but it runs at IMPORT time. And
        # scripts/db/test_auth_gated.py imports import_asm_to_surface for real
        # rather than stubbing it. So collection called sys.exit(1) inside a
        # module import, pytest raised INTERNALERROR, and the whole session
        # died with exit 3 before a single test ran.
        #
        # It passed locally only because the sandbox had psycopg installed
        # system-wide. A "clean checkout" repro is not clean if the
        # INTERPRETER still has the packages.
        #
        # The real guard against a live connection is that this job has no DSN:
        # SUPABASE_DSN is empty and no secret is in scope. An installed driver
        # with nothing to connect to cannot reach a database.
        #
        # pyyaml is required for the same class of reason, found on run #2:
        # 34 tests failed with "PyYAML required to read device_fingerprints.yaml".
        # Note the difference in failure mode, which is worth understanding —
        # scanner/normalize.py imports yaml LAZILY and returns {} on failure by
        # design (K4-safe: a missing registry leaks phantoms rather than
        # dropping real ports) with a loud WARN. So no INTERNALERROR, just a
        # silently descoped cloud-phantom filter and 34 red tests.
        #
        # This list was then derived properly instead of one dep per CI run:
        # every third-party import across scripts/ and scanner/ was enumerated,
        # then each candidate was BLOCKED with a raising stub module to see
        # what actually breaks. Results:
        #   psycopg blocked -> 1 error   (INTERNALERROR — matches run #1)
        #   yaml    blocked -> 34 failed (exactly matches run #2)
        #   requests blocked -> 580 passed  (imported lazily; NOT needed)
        # ⚠ 2026-09-15: "backfill scripts with no tests" is stale — backfill now
        # has test_synthesize_fetch_pagination.py. anthropic and supabase are
        # still NOT needed (lazy imports + a fake client), but httpx now IS, and
        # was added to requirements-test.txt with the same block-it-and-prove-it
        # harness: httpx blocked -> 10 failed / 4 passed.
        # anthropic and supabase appear only in backfill scripts, lazily imported.
        # The list lives in requirements-test.txt so it is a versioned artifact
        # you can install locally to reproduce CI exactly, rather than a string
        # buried in a workflow file.
        run: python -m pip install --quiet -r requirements-test.txt

      # ── Lane 0: preflight — can every test module even be imported? ──
      # pytest collects by IMPORTING. Ten production modules in scripts/db do
      # `except ImportError: sys.exit(1)` at module scope, so one missing
      # dependency doesn't fail one test — it raises SystemExit inside
      # collection, which pytest reports as INTERNALERROR and the entire
      # session dies with exit 3 before anything runs. That is what happened on
      # run #1: 580 tests reported as a 60-line traceback that never named the
      # module at fault.
      #
      # This step imports each test module in its OWN subprocess, so a
      # SystemExit is contained and attributable. It prints the offending file
      # and the exit code, then fails. Cheap, and it turns the worst failure
      # mode in this pipeline into one readable line.
      - name: Preflight — every test module imports cleanly
        run: |
          set -uo pipefail
          # MIN_MODULES: a lane that finds nothing must FAIL, not pass quietly.
          # QA of this workflow caught exactly that here — against an empty tree
          # this step printed "all test modules import cleanly" and exited 0.
          # Same bug lane 4 exists to prevent (a check that passes by never
          # running), sitting in the step meant to catch it. A wrong path, a
          # moved directory, or a bad find predicate would have been invisible.
          # The floor is set well BELOW the real count (27 Command / 31 Prodex)
          # on purpose. Its job is detecting "the glob found nothing" — a wrong
          # path, a moved dir, a bad predicate — not policing how many tests
          # exist. Set too close to the actual count it becomes a tripwire that
          # fails the build when someone legitimately deletes a few tests, and
          # a check that cries wolf gets deleted.
          MIN_MODULES=15
          bad=0; n=0
          while IFS= read -r f; do
            n=$((n+1))
            mod_dir=$(dirname "$f"); mod=$(basename "$f" .py)
            if ! out=$(cd "$mod_dir" && python3 -c "import $mod" 2>&1); then
              echo "::error file=$f::cannot be imported — pytest collection would INTERNALERROR here"
              echo "$out" | tail -5
              bad=1
            fi
          done < <(find $PYTEST_ROOTS -name 'test_*.py' -not -path '*/common/tests/*')
          if [ "$n" -lt "$MIN_MODULES" ]; then
            echo "::error::preflight found only $n test modules, expected >= $MIN_MODULES."
            echo "         Either tests were deleted/moved, or this lane's find path is wrong."
            bad=1
          fi
          [ $bad -eq 0 ] && echo "$n test modules import cleanly"
          exit $bad

      # ── Lane 1: pytest-style (~580 tests, 27 files) ──
      - name: pytest suites
        run: python -m pytest $PYTEST_ROOTS --ignore=scripts/common/tests

      # ── Lane 2: script-style mechanism tests ──
      # scripts/common/tests/* are standalone scripts, not pytest modules:
      # zero `def test_` functions, module-level execution, sys.exit() at the
      # end. pytest cannot collect them — importing one runs it and the
      # SystemExit aborts the whole session with INTERNALERROR. They are run
      # as programs, which is what they are.
      # ::warning:: in EXPECTED test output is neutralised, deliberately.
      # The gate suites simulate DB blips on purpose, and the retry path prints
      # "::warning::roe_gate ownership lookup attempt 1/3 failed" — which
      # Actions parses out of the log stream and attaches to the run. Result:
      # run #4 passed while displaying 8 warning annotations, all of them tests
      # succeeding at proving the retry works. A green build that looks like it
      # has 8 problems is how people learn to stop reading annotations, and
      # then a real one goes unnoticed.
      #
      # Rewriting the prefix keeps the line fully visible in the log while
      # stopping Actions from treating it as a build-level warning. Chosen over
      # ::stop-commands:: because that disables command parsing job-wide and
      # stays disabled if a step exits before re-enabling it.
      - name: gate + mail mechanism suites
        run: |
          set -uo pipefail
          # Counted for the same reason as the preflight. Today an empty glob
          # happens to fail here, but only because the unexpanded literal is
          # passed to python3 and errors — incidental, and it silently inverts
          # to a pass the day anyone sets `shopt -s nullglob`. Count instead of
          # relying on that.
          #
          # Floor sits below the real count (9) for the same reason as the
          # preflight — it detects "the directory vanished", it does not police
          # how many suites exist. The three SAFETY suites are additionally
          # named explicitly in the next step, so losing one of THOSE fails
          # there regardless of this number.
          MIN_SUITES=6
          fail=0; ran=0
          run_one() {  # run_one <cmd> <file>
            if "$1" "$2" 2>&1 | sed -u 's/^::warning::/[expected-by-test] /'; then
              echo "  -> PASS"
            else
              echo "  -> FAIL"; return 1
            fi
          }
          for f in scripts/common/tests/test_*.py; do
            [ -e "$f" ] || continue
            ran=$((ran+1)); echo "::group::$f"
            run_one python3 "$f" || fail=1
            echo "::endgroup::"
          done
          for f in scripts/common/tests/test_*.sh; do
            [ -e "$f" ] || continue
            ran=$((ran+1)); echo "::group::$f"
            run_one bash "$f" || fail=1
            echo "::endgroup::"
          done
          if [ "$ran" -lt "$MIN_SUITES" ]; then
            echo "::error::ran only $ran mechanism suites, expected >= $MIN_SUITES —"
            echo "         suites were removed or scripts/common/tests/ moved."
            fail=1
          fi
          echo "ran $ran mechanism suites"
          exit $fail

      # ── Lane 3: the safety-gate regression checks, called out by name ──
      # These already ran in lane 2. Re-running them as a named step is
      # deliberate: when this job goes red, the failed step name should say
      # which control broke, not "gate + mail mechanism suites". A fail-open
      # returning to a SAFETY gate deserves its own line in the UI.
      - name: SAFETY gate regression (fail-open must stay closed)
        run: |
          set -euo pipefail
          # Same ::warning:: neutralisation as the previous step — roe_gate's
          # retry path prints one per simulated blip. set -e + pipefail still
          # fail the step on a real failure; verified by running a deliberately
          # failing suite through the same pipe.
          bash scripts/common/tests/test_vpn_egress_gate_mechanism.sh 2>&1 \
            | sed -u 's/^::warning::/[expected-by-test] /'
          python3 scripts/common/tests/test_active_probe_policy_gate_mechanism.py 2>&1 \
            | sed -u 's/^::warning::/[expected-by-test] /'
          python3 scripts/common/tests/test_roe_gate_mechanism.py 2>&1 \
            | sed -u 's/^::warning::/[expected-by-test] /'

      # ── Lane 4: every test file is reachable by one of the lanes ──
      # The failure mode this prevents: a new test lands in a directory no
      # lane globs, goes green forever by never running, and nobody notices —
      # which is exactly how this repo arrived at a suite it could not run.
      #
      # The invariant is "every test_*.py lives under a root lane 1 or lane 2
      # covers" — so the pattern is DERIVED from $PYTEST_ROOTS rather than
      # restated. Restating it was itself a second source of truth, and it
      # rotted twice in 24 hours while the invariant held both times.
      - name: no orphaned test files
        run: |
          set -euo pipefail
          # Coverage derived from $PYTEST_ROOTS (job env). A test_*.py under any
          # root pytest walks is reachable by construction; the orphan this lane
          # exists to catch is a test somewhere pytest is never pointed —
          # ./tools/, ./netlify/, the repo root. (lane 2's ./scripts/common/tests
          # is under ./scripts and needs no separate entry.)
          #
          # ⛔ `case "$f" in $VAR)` CANNOT DO THIS, and the first version of this
          # step tried. In `case`, the `|` separating alternatives is SYNTAX,
          # parsed before expansion — a `|` arriving via a variable is a literal
          # pipe character inside one glob, so "./scanner/test_a.py" would have
          # to contain the text "|./scripts/*|" to match. The `*`s expand fine,
          # which is exactly what makes it look plausible. Run verbatim from the
          # repo root it flagged all 77 test files and exited 1.
          # `[[ == ]]` pattern-matches an unquoted RHS, so it does work.
          is_covered() {
            local f="$1" root
            for root in $PYTEST_ROOTS; do
              [[ "$f" == ./$root/* ]] && return 0
            done
            return 1
          }
          echo "coverage roots (from PYTEST_ROOTS): $PYTEST_ROOTS"
          orphans=0
          while IFS= read -r f; do
            if ! is_covered "$f"; then
              echo "::error file=$f::test file is under no pytest root ($PYTEST_ROOTS) — it will never run"
              orphans=1
            fi
          done < <(find . -name 'test_*.py' -not -path './.venv/*' -not -path './node_modules/*')
          exit $orphans

      # ── Lane 6: undefined names (pyflakes) ──
      # ⛔ WHY A LINTER AND NOT OUR OWN GUARD. `resurrect_if_dark(cur, id,
      # logfn=log)` shipped into a module that has no `log`. Python resolves the
      # name at the CALL, so it raised for the first confirmed_live asset of every
      # run; the importer exited 1; and because the later steps in
      # asm-discover.yml are `if: success()`, the liveness probe worker AND the
      # demotion writer were SKIPPED. A gate flipped live hours earlier silently
      # stopped running. 1358 tests passed the whole time.
      #
      # The first guard written for it used a regex and FAILED ON THE FIXED TREE:
      # it matched the offending token inside the fix's own explanatory comment.
      # The second walked the AST and worked — and was still the wrong answer.
      # Python scope analysis is hard (closures, comprehension scopes,
      # global/nonlocal, star-imports, conditional and try/except definitions,
      # del), and a hand-rolled walker fails by FALSE NEGATIVE, which in a guard
      # is strictly worse than the false positive that had just been caught.
      #
      # pyflakes has done this correctly for fifteen years. Run against the broken
      # tree it found the shipped bug AND a second undefined name — `utc_now` in
      # the phantom/ct_ghost path, latent since 2026-06-06, invisible to the whole
      # suite because nothing executes that file's DB path. Two real defects, one
      # second, zero code. Before building a new instrument, check whether a
      # standard one already exists.
      #
      # ⚠ UNDEFINED-NAME ONLY, AND NO BASELINE FILE. There are ~85 other pyflakes
      # findings per repo (unused imports, f-strings without placeholders). They
      # are real but cosmetic, and gating them today would require a
      # hand-maintained ignore list — the kind of artifact that rotted twice in 24
      # hours this week. One rule, zero tolerance, nothing to maintain.
      #
      # ⚠ WHOLE TREE, NOT THE DIFF. `utc_now` proves this class hides in code
      # nobody is touching; a diff-scoped check would have missed it for another
      # three months.
      #
      # ⚠ AND IT IS NOT A SUBSTITUTE FOR EXECUTING THE CODE. Mutation-tested three
      # ways: restoring `logfn=log` and restoring `or utc_now()` are both caught
      # here — but removing ONLY the COALESCE defaults (writing NULL into
      # first_observed/last_observed) is invisible to pyflakes and caught solely by
      # test_importer_confirmed_live_branch.py. A linter proves names resolve; only
      # running the path proves it behaves.
      - name: No undefined names
        run: |
          set -uo pipefail
          # MIN_FILES: a lane that scans nothing must FAIL, not pass quietly —
          # the same failure mode lanes 0 and 4 exist to prevent. Floor set well
          # below the real count so deleting a few files never cries wolf.
          MIN_FILES=100
          n=$(find $PYTEST_ROOTS -name '*.py' | wc -l)
          if [ "$n" -lt "$MIN_FILES" ]; then
            echo "::error::pyflakes lane found only $n .py files under '$PYTEST_ROOTS', expected >= $MIN_FILES."
            echo "         Either the roots are wrong or the checkout is incomplete. Refusing to pass."
            exit 1
          fi
          # ⛔ NO TEMP FILE, AND NO `|| true` ON THE INVOCATION. The first draft
          # of this step wrote to /tmp and swallowed the exit code. Run locally in
          # a sandbox where /tmp was not writable, the redirect failed, `|| true`
          # hid it, and grep then read a STALE file from an earlier run — the step
          # reported a defect that was no longer there, with total confidence.
          # That is this lane's own failure mode, committed inside the lane written
          # to prevent it. Capture in a variable and READ THE EXIT CODE instead:
          #   pyflakes 0 = clean · 1 = findings · >1 = it did not run.
          # "It did not run" must never look like "it found nothing".
          out=$(python -m pyflakes $PYTEST_ROOTS 2>&1); rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::pyflakes exited $rc — it did not complete. This is NOT a pass."
            echo "$out"
            exit 1
          fi
          undef=$(printf '%s\n' "$out" | grep 'undefined name' || true)
          if [ -n "$undef" ]; then
            echo "$undef" | while IFS= read -r line; do
              f=${line%%:*}; rest=${line#*:}; l=${rest%%:*}
              echo "::error file=$f,line=$l::$line"
            done
            echo
            echo "An undefined name is a NameError waiting for the first input that"
            echo "reaches that line. It is not style. Fix it or define it."
            exit 1
          fi
          echo "pyflakes: 0 undefined names across $n files ($(printf '%s\n' "$out" | grep -c . ) other findings, not gated)"
