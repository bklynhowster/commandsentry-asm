name: Refresh cloud IP ranges

# Populates scripts/asm/cloud_ip_ranges.json — the scan-time IP-prefix BACKSTOP for
# cloud_ip_check.py (4.7 ruling P3, revised M1, 2026-07-24). Fetches the official
# provider feeds (GCP/AWS/Azure) HERE (a runner that can reach them) rather than at
# scan time, so the committed file is deterministic and scan-time needs zero external
# calls. Safety lives in refresh_cloud_ranges.py: a feed that fails or returns a
# suspiciously small set RETAINS the committed prefixes (never blindly emptied).
#
# NOTE: v1 commits directly to main (the script's retain-on-failure guard is the safety
# net, matching the repo's existing asm-scan auto-commit pattern). A PR-review upgrade
# (peter-evans/create-pull-request) is the intended hardening per 4.7 P3.

on:
  schedule:
    - cron: '30 4 * * 0'      # weekly, Sunday 04:30 UTC
  workflow_dispatch: {}        # manual — use this to POPULATE the seed the first time

concurrency:
  group: refresh-cloud-ranges
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # ⛔ SAME DEPLOY KEY, SAME REASON (D-041). This workflow commits
      #   scripts/asm/cloud_ip_ranges.json to main every Sunday; a GITHUB_TOKEN push
      #   is rejected by the ruleset exactly as asm-discover's was. It refuses
      #   without the key rather than failing at the push.
      - name: Refuse without the deploy key (D-041)
        env:
          ASM_DEPLOY_KEY: ${{ secrets.ASM_DEPLOY_KEY }}
        run: |
          set -uo pipefail
          # ⚠ ${VAR:-} NOT ${VAR}: under `set -u` a bare reference to an UNSET
          #   variable aborts with "unbound variable" and the operator never sees
          #   the guidance below. Measured both ways. GitHub always defines the
          #   env key (empty when the secret is missing), so this is belt-and-braces
          #   — but a refusal whose message appears in only one of its two failure
          #   modes is half a refusal.
          if [ -z "${ASM_DEPLOY_KEY:-}" ]; then
            echo "::error::ASM_DEPLOY_KEY is not set — this workflow pushes to main."
            echo "::error::See BRANCH-PROTECTION-SETUP.md, 'Who else pushes to main'."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # ⚠ A deploy-key push IS an ordinary push, so it triggers `push` workflows.
          #   This commit touches scripts/asm/cloud_ip_ranges.json, which tests.yml
          #   does NOT ignore (its paths-ignore is data/**, web/data/**, **.md) —
          #   so `tests` will now run on the weekly refresh commit where it never did
          #   before. That is desirable and it is stated rather than discovered.
          ssh-key: ${{ secrets.ASM_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch + build cloud_ip_ranges.json
        run: python3 scripts/asm/refresh_cloud_ranges.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- scripts/asm/cloud_ip_ranges.json; then
            echo "No change in cloud_ip_ranges.json"; exit 0
          fi
          git config user.name  "commandsentry-bot"
          git config user.email "bot@commandsentry.local"
          git add scripts/asm/cloud_ip_ranges.json
          git commit -m "chore(cloud-ranges): weekly refresh of cloud_ip_ranges.json (N2 backstop)"
          git pull --rebase --autostash || true
          git push
