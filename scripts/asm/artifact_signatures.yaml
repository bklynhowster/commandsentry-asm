  # ── FortiWeb: the BLOCK PAGE itself, served at HTTP 500 (relay 528) ─────────
  # ⛔ The reason this entry exists: a block is not always a terse status. On
  # commandcommcentral FortiWeb refuses with a FULL block page carried on HTTP 500,
  # and 500 is not in the classifier's edge-status set. Those blocks were being
  # discarded, and an asset FortiWeb refuses on every vector scored waf_present=False
  # — which publishes a customer-facing HIGH saying "no enforcing WAF" about a fully
  # protected host. Status alone cannot identify a block.
  #
  # ⚠ TWO markers required, never one: the headline plus a per-request incident id.
  # "blocked" alone is ordinary application copy. The per-request ids also explain the
  # body-size variance (39,116 / 39,120 / 39,121 / 39,131) that two sessions first
  # misread as the application reflecting input.
  #
  # ⚠ PRESENCE-ONLY at the verdict layer (Q3/Q8): this signature names FortiWeb HERE,
  # in the registry, as a vendor artifact. It does NOT license the differential probe
  # to assert a vendor — that verdict stays "a WAF is blocking", unnamed.
  - name: fortiweb_block_page
    artifact_type: response_body_marker
    vendor: Fortinet
    product: FortiWeb
    vendor_unique: true
    wired: true
    markers_all_required:
      headline: "Web Page Blocked!"
      incident_id_any_of: ["Attack ID:", "Message ID:"]
    citation:
      source_type: first_party_measurement
      observed_on: commandcommcentral.com
      observed_at: 2026-09-29
      method: "browser GET /?q=../../../../etc/passwd — statusCode 500, body carried 'Web Page Blocked!', 'Client IP: ...', 'Attack ID: 20000008', 'Message ID: 000180461326'"
      # url added 2026-10-14 (312): the block-page library and the R4 citation
      # validator both require url + quote; the wafw00f plugin that matches this
      # same page (previously only under corroboration) is the citable source.
      url: https://github.com/EnableSecurity/wafw00f/blob/master/wafw00f/plugins/fortiweb.py
      quote: "Web Page Blocked!"
      corroboration:
        - https://github.com/EnableSecurity/wafw00f/blob/master/wafw00f/plugins/fortiweb.py
      note: "wafw00f's FortiWeb plugin independently matches a FortiWeb block page, so the marker is not unique to our observation. ⚠ Upgrade source_type to vendor_primary_documentation when a Fortinet doc for the block-page text is located; recorded honestly as a first-party measurement until then."
      quote_provenance: "measured directly by session 4.7 on 2026-09-29 and recorded in relay 528; canonical and %2f-encoded traversal both returned the same page with the same Attack ID, which also disproved an encoding-bypass hypothesis raised in relay 526."

  # ═══════════════════════════════════════════════════════════════════════════
  # ── BLOCK-PAGE LIBRARY (Obsidian 312, 2026-10-14) ──────────────────────────
  # The second vendor signal. The heavy differential probe already CAPTURES every
  # deny response it receives (details.fired[*].body_head + raw_headers, relay
  # 516/531). A deny page that names its own vendor is a vendor artifact the
  # classifier can read, independent of wafw00f's header tells, and it is the
  # one artifact that survives when the headers say nothing (Google's 134-byte 403
  # names nothing; Wordfence's 17 KB 403 names itself four times).
  #
  # Howie, 2026-10-13: "What if there's a Palo Alto in front of us or a Cisco …
  # I want us to be able to begin fingerprinting security devices." A vendor in
  # this library is NAMED from its page. A vendor NOT in this library is not
  # guessed: the daily digest says "something blocked attack strings on <host>
  # and I do not recognize its block page", and the captured page is in the
  # artifact for review and addition here — WITH a citation, never on say-so.
  #
  # ⚠ TWO MARKERS, ALWAYS (relay 528's rule): a headline the vendor prints AND a
  # second vendor-naming marker on the same page. One phrase is application copy.
  #
  # ⚠ INDEPENDENCE vs wafw00f (4.7 R4). wafw00f also sends attack requests and
  # its plugins match several of these SAME block pages (fortiweb.py 'Web Page
  # Blocked', wordfence.py 'Generated by Wordfence', cloudflare.py the Ray-ID
  # page, f5bigipasm.py 'The requested URL was rejected'). A block page wafw00f
  # can match is the SAME ARTIFACT as wafw00f's verdict, so those rows carry
  # dedupe_key wafw00f_detection in device_fingerprints.yaml: they NAME the
  # vendor (which wafw00f's 'generic' verdict did not, on commandcompanies.com)
  # but do not count as a second independent tell. Only a page wafw00f has no
  # plugin for (the Automattic 406) is independent and can corroborate.
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Wordfence (Defiant): the 403 block page (first-party measurement) ──────
  # Measured on commandcompanies.com 2026-10-14 09:13:10Z: the XSS probe class
  # returned HTTP 403 with a 17,006-byte page carrying "About Wordfence",
  # "Wordfence is a security plugin installed on over 5 million WordPress sites.
  # The owner of this site is using Wordfence to manage access to their site.",
  # a link to https://www.wordfence.com/help/?query=locked-out, and the footer
  # "Generated by Wordfence at Wed, 14 Oct 2026 9:13:10 GMT." The SQLi and
  # traversal classes did NOT get this page (200 and a 406 from the edge).
  # Wordfence is a WordPress plugin — an application-layer WAF running INSIDE
  # the site, not an edge in front of it; device_class waf, vendor Defiant.
  - name: wordfence_block_page
    artifact_type: response_body_marker
    vendor: Defiant
    product: Wordfence
    vendor_unique: true
    wired: true
    markers_all_required:
      headline: "Generated by Wordfence"
      incident_id_any_of: ["About Wordfence", "using Wordfence to manage access"]
    citation:
      source_type: first_party_measurement
      observed_on: commandcompanies.com
      observed_at: 2026-10-14
      method: "heavy differential probe, XSS class, GET /?q579290=<script>… — HTTP 403, 17,006 B, body carried 'About Wordfence', 'The owner of this site is using Wordfence to manage access to their site', 'Generated by Wordfence at Wed, 14 Oct 2026 9:13:10 GMT'"
      url: https://www.wordfence.com/help/?query=locked-out
      quote: "Generated by Wordfence"
      corroboration:
        - https://www.wordfence.com/help/blocking/troubleshooting/
      note: "The page itself links the vendor's own help site (url above) as its documentation; wordfence.com refuses automated fetches, so the help text could not be quoted. ⚠ Upgrade source_type to vendor_primary_documentation when the Blocking Troubleshooting page can be quoted. wafw00f's wordfence plugin matches this same page — dedupe_key wafw00f_detection."
      quote_provenance: "measured by session 4.8 on 2026-10-14 (scan_run 5e96377e), recorded in vault note 312"

