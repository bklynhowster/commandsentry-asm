  # ── Cloudflare: the firewall-rule / WAF block page (PRIMARY vendor doc) ─────
  # Cloudflare's deny page carries a Cloudflare Ray ID and, for a firewall-rule
  # denial, "Error 1020 / Access denied"; the WAF managed-rules deny reads "Sorry,
  # you have been blocked". Vendor doc: Error 1020 is "denied by a Cloudflare
  # firewall rule" and the visitor's error message carries the Ray ID.
  - name: cloudflare_block_page
    artifact_type: response_body_marker
    vendor: Cloudflare
    product: Cloudflare
    vendor_unique: true
    wired: true
    markers_all_required:
      headline: "Cloudflare Ray ID"
      incident_id_any_of: ["Sorry, you have been blocked", "Access denied", "Error 1020", "Attention Required! | Cloudflare"]
    citation:
      source_type: vendor_primary_documentation
      url: https://developers.cloudflare.com/support/troubleshooting/http-status-codes/cloudflare-1xxx-errors/error-1020/
      quote: "This error indicates that access to the website is denied by a Cloudflare firewall rule."
      corroboration:
        - https://developers.cloudflare.com/fundamentals/reference/cloudflare-ray-id/
      cited_at: 2026-10-14
      note: "The 1020 page tells site owners to search 'for the Ray ID or client IP address from the visitor's 1020 error message' — the Ray ID is on the page. wafw00f's cloudflare plugin matches this page too — dedupe_key wafw00f_detection."
      quote_provenance: "Cloudflare developer docs, Error 1020; surfaced via web search 2026-10-14"

